services:
  - type: web
    name: vantage-intelligence
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: VANTAGE_ENVIRONMENT
        value: production
      - key: VANTAGE_DEBUG
        value: "false"
      - key: VANTAGE_DB_PATH
        value: /tmp/vantage.db
      - key: VANTAGE_DEFAULT_TRIALS
        value: "3"
      - key: VANTAGE_MAX_BUDGET_STEPS
        value: "15"
      - key: VANTAGE_MAX_BUDGET_TIME_SEC
        value: "30.0"
